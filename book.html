<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking... — God of Automation</title>
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      text-align: center;
      padding: 48px 32px;
    }
    .icon {
      font-size: 52px;
      margin-bottom: 24px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #090E17;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #64748B;
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #2563EB 0%, #7C3AED 50%, #EF4444 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 9999px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a.btn:hover { opacity: 0.88; }
    .back {
      display: block;
      margin-top: 18px;
      font-size: 14px;
      color: #64748B;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📅</div>
    <h1>Opening your booking page...</h1>
    <p>If the calendar didn't open automatically, click the button below.</p>
    <a href="https://calendly.com/godofautomationofficial/30min" target="_blank" rel="noopener" class="btn" id="calendlyBtn">
      Open Calendly &nbsp;→
    </a>
    <a class="back" href="index.html">← Back to God of Automation</a>
  </div>

  <script>
    // Auto-open Calendly in a new tab immediately
    window.addEventListener('DOMContentLoaded', function () {
      window.open('https://calendly.com/godofautomationofficial/30min', '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
